# Per-camera parameters for pyrt, see pyrt/utils/camera_config.py
#
# Sections: [DEFAULT], [camera], [camera/YYYY-MM-DD], [camera@TELESCOP],
# [camera@TELESCOP/YYYY-MM-DD]; camera is the pyrt-chip-id name, several may be
# given comma-separated, ccd:CCD_NAME for cameras the registry does not know.
# Local overrides go to ~/.config/pyrt/cameras.ini.
#
# A key the header may also carry (e.g. gain) is a fallback for frames without
# it; force.<key> overrides the header.
#
# Camera model for refit_astrometry (-z starts from it, --zpn-from-camera
# without -z holds it fixed):
#   proj            projection, default ZPN (gets PV2_1=1 fixed)
#   PV2_n           radial terms
#   CRPIX1, CRPIX2  optical axis, full-frame pixels (LTV/LTM crop applied)
#                   PV2_n or CRPIX make a camera model; without one -z selects
#                   the terms by stepwise regression
#   always_fit      fit the model even without -z
#
# Dark noise model for asarina make_calib (expected pair-difference sigma of
# two darks, ADU, and its relative tolerance):
#   noise.<binning> = rn=.. [dark=.. t0=.. tdouble=..] tol=..
#   sigma = sqrt(rn^2 + dark*(exptime + t0) * 2^(temp/tdouble)), no temperature
#   factor without tdouble.  A camera whose readout modes differ lists them as
#   noise.<binning>.<readmode>; an unlisted mode gets the [DEFAULT] model, a
#   binning the camera lacks its 1x1.

[DEFAULT]
# Detector fallbacks for frames without GAIN / SATURATE (read noise is never
# taken from the header); per single readout, phcat scales them for NCOMBINE
# and on-chip summing.  These are the D50 Andor values, which every camera got
# before cameras.ini.
gain = 0.81
rnoise = 4.63
saturation = 60000

# dark noise for cameras without a model
noise.1x1 = rn=8.0 tol=0.5
noise.2x2 = rn=8.0 tol=0.5

# ASTQUAL limits, first calibration on D50/C0 (53457, 2026-10-06): good fits
# ANISO~0.3%, DCEN~1px, DMAX~6px; fits broken by a runaway -z refit ANISO 9-25%,
# DCEN 38-68px, DMAX 92-278px.
# |final/input pixel scale - 1|
astqual_max_dscal = 0.02
# CD singular value ratio - 1 (skew/anisotropy)
astqual_max_aniso = 0.02
# rotation change against input WCS (deg)
astqual_max_drot = 1.0
# chip centre shift against input WCS (px)
astqual_max_dcen = 10.0
# max final-vs-input displacement over the chip (px)
astqual_max_dmax = 20.0
# local scale over the chip relative to the centre
astqual_jac_min = 0.9
astqual_jac_max = 1.1
# ASTSIGMA / FWHM
astqual_max_sigf = 0.5
# fraction of 4x4 chip cells holding a fitted star
astqual_min_cover = 0.75
# chi2/dof of per-cell mean residual vectors
astqual_max_chi2c = 3.0
# tolerated systematic shift of a cell mean (FWHM fraction)
astqual_sys_fwhm = 0.04

