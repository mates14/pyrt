# --- BOOTES ------------------------------------------------------------------

# BOOTES-2 / COLORES Andor iXon, serial 3567
# Pair-difference sigma measured flat at ~3.0 ADU across 1-300 s at -58.5 C
# (read-noise dominated, negligible dark current). Wide-ish tolerance covers
# the observed 1.9-3.65 spread; refine from noise-andor3567.out once a
# validated run accumulates data.  2x2 TODO: verify if 2x2 darks appear.
[andor3567]
noise.1x1 = rn=3.0 tol=0.5
noise.2x2 = rn=3.0 tol=0.5

# BOOTES-2 Andor iXon, serial 1708 - keyed by readout mode, because the
# conventional and EM output registers have very different read noise.
# Floors from --measure-noise on 2009 (noise-andor1708): pair-difference sigma
# flat across 1-60 s at the cold setpoints, read-noise dominated.
#   CO-0-14-1.0 (conventional, 14-bit): floor ~2.2 ADU (= the ~2.2 read noise)
#   EM-0/EM-1   (EM register, 14-bit):  floor ~3.8 ADU (EM excess noise)
# The lone -140 C / 1.18-ADU EM-1 cluster is a spurious-temperature (likely
# high-EM-gain) outlier that cannot be keyed (old driver omits EMCCDGAIN); it
# falls below this window and is correctly rejected rather than averaged in.
[andor1708]
noise.1x1.CO-0-14-1.0 = rn=2.2 tol=0.5
noise.1x1.EM-0-14-1.0 = rn=3.8 tol=0.6
noise.1x1.EM-1-14-1.0 = rn=3.8 tol=0.6

